[package]
name = "burnervm-tui"
version = "0.1.1"
description = "a terminal UI for burner: pick an image and settings, start a shell or run, watch and kill running VMs"
readme = "../README.md"
keywords = ["firecracker", "microvm", "sandbox", "tui"]
categories = ["command-line-utilities", "virtualization"]
homepage = "https://burnervm.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "burner-tui"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
