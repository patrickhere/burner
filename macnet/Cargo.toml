[package]
name = "burner-macnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "user-space network for one burner VM on macos: a filtering gateway on a unixgram socket"

# not in the workspace yet, so the linux build never sees it
[workspace]

[dependencies]
libc = "0.2.191"
socket2 = "0.6.5"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
