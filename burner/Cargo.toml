[package]
name = "burnervm"
version = "0.1.1"
description = "throwaway linux VMs on your own hardware: firecracker microVMs you get a shell in or run a command in, deleted when you're done"
readme = "../README.md"
keywords = ["firecracker", "microvm", "sandbox", "kvm", "vm"]
categories = ["command-line-utilities", "virtualization"]
homepage = "https://burnervm.dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "burner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tar = "0.4.46"
toml = "1.2.1"

# the per-VM network process on macOS (burner macnet): a tcp/ip stack for the
# guest's side, and nonblocking connects for the host's. smoltcp 0.13 and up need
# rust 1.91, 0.12 is the newest that builds on rust-version
[target.'cfg(target_os = "macos")'.dependencies]
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
socket2 = "0.6.5"
