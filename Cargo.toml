[workspace]
members = ["burner", "burner-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patrickhere/burner"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# for test builds: what release ships minus lto, a few times faster to build
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
