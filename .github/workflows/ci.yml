# lint, unit tests and static builds. the VM test suites need root, kvm and
# nftables: vm-suites.yml runs them on a github runner, and a dedicated box
# runs them against main too
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # the one rust-toolchain.toml pins, which cargo picks up from there
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal -c clippy,rustfmt -t "$TARGET"
          sudo apt-get install -y -qq musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: oldest supported rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal -t ${{ matrix.target }}
          cargo +"$msrv" check --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static binary
        run: |
          for b in burner burner-tui; do
            f=target/${{ matrix.target }}/release/$b
            file "$f" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
            "$f" --version
          done
      # what install.sh and the formula install: completions for each shell
      # and a man page per command, none of them for a hidden one
      - name: completions and man pages
        env:
          TARGET: ${{ matrix.target }}
        run: |
          b="target/$TARGET/release/burner"
          for sh in bash zsh fish elvish powershell; do
            "$b" completions "$sh" > "$RUNNER_TEMP/comp-$sh"
            grep -q 'burner' "$RUNNER_TEMP/comp-$sh"
            if grep -qwE '__man|__parse-result|__read-netlog|reap' "$RUNNER_TEMP/comp-$sh"; then
              echo "$sh completions offer a hidden command" >&2
              exit 1
            fi
          done
          bash -n "$RUNNER_TEMP/comp-bash"
          "$b" __man "$RUNNER_TEMP/man"
          for p in burner burner-run burner-shell burner-setup burner-completions; do
            [ -s "$RUNNER_TEMP/man/$p.1" ] || { echo "no $p.1" >&2; exit 1; }
          done
          for f in "$RUNNER_TEMP/man"/*; do
            case "${f##*/}" in
              *__* | *reap*) echo "a man page for a hidden command: $f" >&2; exit 1 ;;
            esac
          done

  # burner -H over ssh to a private sshd on localhost, with a stand-in burner
  # on the far end: every rule the client has, no kvm needed. the only ci
  # run of burner's tests on a mac, and of the quoting tests through zsh,
  # fish, dash and ksh
  remote:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain and shells
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal -c clippy,rustfmt
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq zsh fish dash ksh
          else
            brew update --quiet
            brew install libkrun fish
          fi
      - run: cargo test --locked -p burnervm
      - run: cargo build --locked -p burnervm
      - run: BURNER=target/debug/burner bash tests/remote.sh --fake-only

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh get.sh guest/init tools/build-image tools/formula-shas burner/src/remote/wrap.sh
      # keys.asc is all apt trusts when the debian image is built, so it has to
      # hold exactly the keys images/debian/keys.fingerprints pins
      - name: debian keys match the pinned fingerprints
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --show-keys --with-colons images/debian/keys.asc | awk -F: '$1 == "fpr" { print $10 }' | sort > "$RUNNER_TEMP/have"
          grep -v '^#' images/debian/keys.fingerprints | awk 'NF { print $1 }' | sort > "$RUNNER_TEMP/want"
          [ -s "$RUNNER_TEMP/want" ]
          diff "$RUNNER_TEMP/want" "$RUNNER_TEMP/have" || { echo "keys.asc and keys.fingerprints differ" >&2; exit 1; }
      # the suites run as a user with sudo and redirect on purpose
      - run: shellcheck -S warning -e SC2024 tests/*.sh
