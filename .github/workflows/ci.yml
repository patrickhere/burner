# lint, unit tests and static builds. the VM test suites need root, kvm and
# nftables: vm-suites.yml runs them on a github runner, and a dedicated box
# runs them against main too
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt -t ${{ matrix.target }}
          rustup default stable
          sudo apt-get install -y -qq musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: oldest supported rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal -t ${{ matrix.target }}
          cargo +"$msrv" check --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static binary
        run: |
          for b in burner burner-tui; do
            f=target/${{ matrix.target }}/release/$b
            file "$f" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
            "$f" --version
          done

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh get.sh guest/init tools/build-image tools/formula-shas
      # the suites run as a user with sudo and redirect on purpose
      - run: shellcheck -S warning -e SC2024 tests/*.sh
