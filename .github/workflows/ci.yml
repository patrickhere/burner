# lint, unit tests and static builds. the VM test suites need root, kvm and
# nftables, so they run on a dedicated box against main, not here
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt -t ${{ matrix.target }}
          rustup default stable
          sudo apt-get install -y -qq musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static binary
        run: |
          f=target/${{ matrix.target }}/release/burner
          file "$f" | tee /dev/stderr | grep -q 'statically linked'
          "$f" --version

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh guest/init tools/build-image
      # the suites run as a user with sudo and redirect on purpose
      - run: shellcheck -S warning -e SC2024 tests/*.sh
