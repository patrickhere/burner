# a v* tag builds static binaries for x86_64 and arm, packs each with install.sh
# and what it needs, and publishes them with SHA256SUMS and build provenance as a
# github release. for burner on apple silicon, which builds its own binary, the
# release also carries the arm guest kernel, a ready alpine image and the list
# of packages in that image
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt -t ${{ matrix.target }}
          rustup default stable
          sudo apt-get install -y -qq musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static binary
        run: |
          for b in burner burner-tui; do
            f=target/${{ matrix.target }}/release/$b
            file "$f" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
            "$f" --version
          done
      - name: package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="burner-$TAG-$ARCH-linux"
          d="pkg/$name"
          mkdir -p "$d/guest"
          install -m 0755 "target/$TARGET/release/burner" "target/$TARGET/release/burner-tui" "$d/"
          cp guest/init "$d/guest/"
          cp -R install.sh dist images tools README.md LICENSE-MIT LICENSE-APACHE SECURITY.md "$d/"
          chmod -R u=rwX,go=rX "$d"
          tar -C pkg --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -9n > "$name.tar.gz"
          tar -tzvf "$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burner-${{ matrix.arch }}
          path: burner-*.tar.gz
          if-no-files-found: error

  # what burner setup fetches on a mac: the kernel install.sh pins, and the alpine
  # image from tools/build-image, both for aarch64
  macos-assets:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: guest kernel
        run: |
          build=$(sed -n 's/^KERNEL_BUILD=//p' install.sh)
          ver=$(sed -n 's/^KERNEL_VERSION=//p' install.sh)
          sha=$(sed -n '/^    aarch64)/,/;;/s/.*KERNEL_SHA=\([0-9a-f]*\).*/\1/p' install.sh)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "no aarch64 kernel sha256 in install.sh" >&2; exit 1; }
          mkdir -p out
          curl -fsSL --proto =https --retry 3 -o out/vmlinux-aarch64 \
            "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/$build/aarch64/vmlinux-$ver"
          echo "$sha  out/vmlinux-aarch64" | sha256sum -c -
      - name: alpine image
        env:
          BURNER_ROOT: ${{ runner.temp }}/burner
        run: |
          [ "$(uname -m)" = aarch64 ]
          tools/build-image alpine
          gzip -9n -c "$BURNER_ROOT/images/alpine/rootfs.ext4" > out/alpine-aarch64.ext4.gz
          # apk installs whatever the mirror has today, so this is the record of
          # what went into the image: every package and its version
          debugfs -R 'cat /lib/apk/db/installed' "$BURNER_ROOT/images/alpine/rootfs.ext4" 2>/dev/null \
            | awk '/^P:/ { p = substr($0, 3) } /^V:/ { print p, substr($0, 3) }' \
            | LC_ALL=C sort > out/alpine-aarch64.packages
          grep -q '^apk-tools ' out/alpine-aarch64.packages || { echo "no package list from the image" >&2; exit 1; }
          cat out/alpine-aarch64.packages
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burner-macos
          path: |
            out/vmlinux-aarch64
            out/alpine-aarch64.ext4.gz
            out/alpine-aarch64.packages
          if-no-files-found: error

  release:
    needs: [build, macos-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # build provenance for the tarballs: gh attestation verify
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: burner-*
          path: out
          merge-multiple: true
      - name: checksums
        run: |
          cd out
          tarballs=(burner-*.tar.gz)
          [ "${#tarballs[@]}" = 2 ] || { echo "expected 2 tarballs, got: ${tarballs[*]}" >&2; exit 1; }
          sha256sum burner-*.tar.gz vmlinux-aarch64 alpine-aarch64.ext4.gz alpine-aarch64.packages > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/burner-*.tar.gz
            out/vmlinux-aarch64
            out/alpine-aarch64.ext4.gz
            out/alpine-aarch64.packages
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # the CHANGELOG.md section for this version, empty if there is none
          awk -v h="## ${TAG#v}" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md 2>/dev/null || true
          gh release create "$TAG" out/burner-*.tar.gz out/vmlinux-aarch64 out/alpine-aarch64.ext4.gz \
            out/alpine-aarch64.packages out/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file notes.md

  # the crates are burnervm and burnervm-tui (burner was taken on crates.io), the
  # commands they install are still burner and burner-tui
  crates:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for c in burner burner-tui; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$c/Cargo.toml" | head -n 1)
            [ "v$v" = "$TAG" ] || { echo "$c/Cargo.toml says $v, the tag is $TAG" >&2; exit 1; }
          done
      # build.rs reads the kernel pin from install.sh only for macOS, so a
      # crate without it would build here and fail on every mac
      - name: the crate carries install.sh
        run: |
          cargo package --locked --list -p burnervm > "$RUNNER_TEMP/files"
          grep -qx install.sh "$RUNNER_TEMP/files" || { echo "install.sh isn't in the burnervm crate" >&2; exit 1; }
          grep -q '^    aarch64)' burner/install.sh
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p burnervm
          cargo publish --locked -p burnervm-tui
