# a v* tag builds static binaries for x86_64 and arm, packs each with install.sh
# and what it needs, and publishes them with SHA256SUMS and build provenance as a
# github release. the release also carries the alpine and debian images for both
# arches, what burner setup fetches, and for burner on apple silicon a mac build
# for the homebrew formula and the arm guest kernel. each image comes with the
# list of packages in it
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # the one rust-toolchain.toml pins, which cargo picks up from there
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal -c clippy,rustfmt -t "$TARGET"
          sudo apt-get install -y -qq musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: static binary
        run: |
          for b in burner burner-tui; do
            f=target/${{ matrix.target }}/release/$b
            file "$f" | tee /dev/stderr | grep -qE 'statically linked|static-pie linked'
            "$f" --version
          done
      # what install.sh and the formula install: completions for each shell
      # and a man page per command, none of them for a hidden one
      - name: completions and man pages
        env:
          TARGET: ${{ matrix.target }}
        run: |
          b="target/$TARGET/release/burner"
          for sh in bash zsh fish elvish powershell; do
            "$b" completions "$sh" > "$RUNNER_TEMP/comp-$sh"
            grep -q 'burner' "$RUNNER_TEMP/comp-$sh"
            if grep -qwE '__man|__parse-result|__read-netlog|reap' "$RUNNER_TEMP/comp-$sh"; then
              echo "$sh completions offer a hidden command" >&2
              exit 1
            fi
          done
          bash -n "$RUNNER_TEMP/comp-bash"
          "$b" __man "$RUNNER_TEMP/man"
          for p in burner burner-run burner-shell burner-setup burner-completions; do
            [ -s "$RUNNER_TEMP/man/$p.1" ] || { echo "no $p.1" >&2; exit 1; }
          done
          for f in "$RUNNER_TEMP/man"/*; do
            case "${f##*/}" in
              *__* | *reap*) echo "a man page for a hidden command: $f" >&2; exit 1 ;;
            esac
          done
      - name: package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="burner-$TAG-$ARCH-linux"
          d="pkg/$name"
          mkdir -p "$d/guest"
          install -m 0755 "target/$TARGET/release/burner" "target/$TARGET/release/burner-tui" "$d/"
          cp guest/init "$d/guest/"
          cp -R install.sh dist images tools README.md LICENSE-MIT LICENSE-APACHE SECURITY.md "$d/"
          chmod -R u=rwX,go=rX "$d"
          tar -C pkg --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -9n > "$name.tar.gz"
          tar -tzvf "$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burner-${{ matrix.arch }}
          path: burner-*.tar.gz
          if-no-files-found: error

  # the images, built with tools/build-image on each arch: alpine and debian,
  # what burner setup fetches on linux and on a mac, and for the mac the
  # kernel install.sh pins
  images:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mmdebstrap
        run: |
          [ "$(uname -m)" = "$ARCH" ]
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap
          mkdir -p out
          # the runner context isn't allowed in a job's env, so it's set here
          echo "BURNER_ROOT=$RUNNER_TEMP/burner" >> "$GITHUB_ENV"
      - name: guest kernel
        if: matrix.arch == 'aarch64'
        run: |
          build=$(sed -n 's/^KERNEL_BUILD=//p' install.sh)
          ver=$(sed -n 's/^KERNEL_VERSION=//p' install.sh)
          sha=$(sed -n '/^    aarch64)/,/;;/s/.*KERNEL_SHA=\([0-9a-f]*\).*/\1/p' install.sh)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "no aarch64 kernel sha256 in install.sh" >&2; exit 1; }
          curl -fsSL --proto =https --retry 3 -o out/vmlinux-aarch64 \
            "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/$build/aarch64/vmlinux-$ver"
          echo "$sha  out/vmlinux-aarch64" | sha256sum -c -
      - name: alpine image
        run: |
          tools/build-image alpine
          gzip -9n -c "$BURNER_ROOT/images/alpine/rootfs.ext4" > "out/alpine-$ARCH.ext4.gz"
          # apk installs whatever the mirror has today, so this is the record of
          # what went into the image: every package and its version, which
          # build-image writes next to it
          cp "$BURNER_ROOT/images/alpine/packages" "out/alpine-$ARCH.packages"
          for p in apk-tools bash; do
            grep -q "^$p " "out/alpine-$ARCH.packages" || { echo "no $p in the image's package list" >&2; exit 1; }
          done
          cat "out/alpine-$ARCH.packages"
      - name: debian image
        run: |
          # fails unless the packages match images/debian/lock-$ARCH
          tools/build-image debian
          gzip -9n -c "$BURNER_ROOT/images/debian/rootfs.ext4" > "out/debian-$ARCH.ext4.gz"
          cp "$BURNER_ROOT/images/debian/packages" "out/debian-$ARCH.packages"
          cmp "out/debian-$ARCH.packages" "images/debian/lock-$ARCH"
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burner-images-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # burner and burner-tui for apple silicon, linked against homebrew's
  # libkrun, so the formula doesn't need rust (and llvm) to build them. not
  # signed: the formula signs burner with the hypervisor entitlement when it
  # installs it
  macos-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain and libkrun
        run: |
          [ "$(uname -m)" = arm64 ]
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal -c clippy,rustfmt
          # runners ship with brew's auto update off and an older formula list
          brew update --quiet
          brew install libkrun
      - run: cargo build --locked --release
      - name: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="burner-$TAG-aarch64-macos"
          d="pkg/$name"
          mkdir -p "$d"
          install -m 0755 target/release/burner target/release/burner-tui "$d/"
          cp dist/macos/burner.entitlements README.md LICENSE-MIT LICENSE-APACHE SECURITY.md "$d/"
          chmod -R u=rwX,go=rX "$d"
          for b in burner burner-tui; do
            file "$d/$b" | tee /dev/stderr | grep -q 'Mach-O 64-bit executable arm64'
            "$d/$b" --version
          done
          otool -L "$d/burner" | tee /dev/stderr | grep -q "$(brew --prefix)/opt/libkrun/lib/libkrun"
          COPYFILE_DISABLE=1 tar -C pkg --uid 0 --gid 0 --uname root --gname wheel -cf - "$name" | gzip -9n > "$name.tar.gz"
          tar -tzvf "$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burner-macos-build
          path: burner-*-aarch64-macos.tar.gz
          if-no-files-found: error

  release:
    needs: [build, images, macos-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # build provenance for the tarballs: gh attestation verify
      id-token: write
      attestations: write
      # the workflow runs for the tagged commit, below
      actions: read
    steps:
      # nothing is published for a commit that ci and the vm suites didn't
      # both pass. an api error or no run found stops it too
      - name: ci and the vm suites passed this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for wf in ci.yml vm-suites.yml; do
            n=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?head_sha=$SHA&status=success&per_page=1" --jq .total_count) || n=0
            if ! [[ "$n" =~ ^[0-9]+$ ]] || [ "$n" -lt 1 ]; then
              echo "no successful $wf run for $SHA, not publishing" >&2
              exit 1
            fi
            echo "$wf passed $SHA"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: burner-*
          path: out
          merge-multiple: true
      - name: checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          tarballs=(burner-*.tar.gz)
          [ "${#tarballs[@]}" = 3 ] || { echo "expected 3 tarballs, got: ${tarballs[*]}" >&2; exit 1; }
          [ -f "burner-$TAG-aarch64-macos.tar.gz" ] || { echo "no mac build" >&2; exit 1; }
          # a missing image fails the release instead of shipping without it
          for f in vmlinux-aarch64 {alpine,debian}-{x86_64,aarch64}.{ext4.gz,packages}; do
            [ -f "$f" ] || { echo "no $f" >&2; exit 1; }
          done
          images=(*.ext4.gz)
          [ "${#images[@]}" = 4 ] || { echo "expected 4 images, got: ${images[*]}" >&2; exit 1; }
          sha256sum -- burner-*.tar.gz vmlinux-aarch64 *.ext4.gz *.packages > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/burner-*.tar.gz
            out/vmlinux-aarch64
            out/*.ext4.gz
            out/*.packages
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # the CHANGELOG.md section for this version, empty if there is none
          awk -v h="## ${TAG#v}" '$0 == h { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md 2>/dev/null || true
          gh release create "$TAG" out/burner-*.tar.gz out/vmlinux-aarch64 out/*.ext4.gz \
            out/*.packages out/SHA256SUMS \
            --verify-tag --title "$TAG" --notes-file notes.md

  # the crates are burnervm and burnervm-tui (burner was taken on crates.io), the
  # commands they install are still burner and burner-tui
  crates:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for c in burner burner-tui; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$c/Cargo.toml" | head -n 1)
            [ "v$v" = "$TAG" ] || { echo "$c/Cargo.toml says $v, the tag is $TAG" >&2; exit 1; }
          done
      # build.rs reads the kernel pin from install.sh and setup.rs the images'
      # defaults only for macOS, so a crate without them would build here and
      # fail on every mac
      - name: the crate carries install.sh and the image defaults
        run: |
          cargo package --locked --list -p burnervm > "$RUNNER_TEMP/files"
          for f in install.sh alpine-defaults.toml debian-defaults.toml; do
            grep -qx "$f" "$RUNNER_TEMP/files" || { echo "$f isn't in the burnervm crate" >&2; exit 1; }
          done
          grep -q '^    aarch64)' burner/install.sh
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p burnervm
          cargo publish --locked -p burnervm-tui
