# both VM suites on github's own linux runners, which have kvm, once against
# the alpine image and once against debian. install.sh, the image build and
# the suites run exactly as they would on anyone's box. the dedicated box
# still runs them too, on a host with a LAN and vpns
name: vm suites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        img: [alpine, debian]
    name: suites (${{ matrix.img }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMG: ${{ matrix.img }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kvm for everyone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables conntrack jq
          # debian images are built with mmdebstrap
          if [ "$IMG" = debian ]; then sudo apt-get install -y -qq mmdebstrap; fi
      - run: cargo build --locked --release
      - name: install
        run: |
          # the runner image leaves /usr/local/bin writable by the runner user,
          # which install.sh rightly refuses
          sudo chown root:root /usr/local/bin
          sudo chmod 755 /usr/local/bin
          # the network suite tests --net open too
          sudo mkdir -p /etc/burner
          sudo ./target/release/burner config | sed 's/^net = "web"/net = "open"/' | sudo tee /etc/burner/config.toml >/dev/null
          # docker on the runner sets the FORWARD policy to drop
          up=$(ip -4 route show default | awk '{print $5; exit}')
          sudo iptables -I DOCKER-USER -s 172.29.217.0/24 -o "$up" -j ACCEPT
          sudo iptables -I DOCKER-USER -d 172.29.217.0/24 -i "$up" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ./install.sh
      - id: image
        run: tools/build-image "$IMG"
      # apt checks the snapshot against images/debian/keys.asc and nothing
      # else, so with that file empty the build has to stop at apt-get update
      - name: debian without its keys doesn't build
        if: matrix.img == 'debian'
        run: |
          cp -R images/debian images/debian-nokeys
          : > images/debian-nokeys/keys.asc
          if BURNER_ROOT="$RUNNER_TEMP/nokeys" tools/build-image debian-nokeys > "$RUNNER_TEMP/nokeys.log" 2>&1; then
            echo "a debian build with an empty keys.asc went through" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/nokeys.log"
          grep -q 'apt-get update' "$RUNNER_TEMP/nokeys.log"
          rm -rf images/debian-nokeys
      - run: sudo env BURNER_TEST_IMG="$IMG" bash tests/isolation.sh
      # worth running even when isolation failed, as long as there's an image
      - if: always() && steps.image.outcome == 'success'
        run: sudo env BURNER_TEST_IMG="$IMG" bash tests/network.sh
      # burner -H to this runner over ssh, the real burner on the far end. it
      # boots alpine, which only the alpine leg builds
      - if: always() && steps.image.outcome == 'success' && matrix.img == 'alpine'
        run: bash tests/remote.sh
