# both VM suites on github's own linux runners, which have kvm. install.sh, the
# image build and the suites run exactly as they would on anyone's box. the
# dedicated box still runs them too, on a host with a LAN and vpns
name: vm suites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kvm for everyone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables conntrack jq
      - run: cargo build --locked --release
      - name: install
        run: |
          # the runner image leaves /usr/local/bin writable by the runner user,
          # which install.sh rightly refuses
          sudo chown root:root /usr/local/bin
          sudo chmod 755 /usr/local/bin
          # the network suite tests --net open too
          sudo mkdir -p /etc/burner
          sudo ./target/release/burner config | sed 's/^net = "web"/net = "open"/' | sudo tee /etc/burner/config.toml >/dev/null
          # docker on the runner sets the FORWARD policy to drop
          up=$(ip -4 route show default | awk '{print $5; exit}')
          sudo iptables -I DOCKER-USER -s 172.29.217.0/24 -o "$up" -j ACCEPT
          sudo iptables -I DOCKER-USER -d 172.29.217.0/24 -i "$up" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ./install.sh
      - id: image
        run: tools/build-image alpine
      - run: sudo bash tests/isolation.sh
      # worth running even when isolation failed, as long as there's an image
      - if: always() && steps.image.outcome == 'success'
        run: sudo bash tests/network.sh
